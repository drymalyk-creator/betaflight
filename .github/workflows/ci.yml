name: CI
on:
  workflow_call:
    inputs:
      release_build:
        default: false
        required: false
        type: boolean
jobs:
  build:
    name: Build FOXEERF722V4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Init config submodule
        run: git submodule update --init -- src/config
      - name: Install ARM toolchain
        run: make ARM_SDK_DIR=tools arm_sdk_install
      - name: Build FOXEERF722V4
        run: make TARGET=FOXEERF722V4
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: FOXEERF722V4
          path: obj/betaflight_*_FOXEERF722V4.hex
